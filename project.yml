# XcodeGen-Projektbeschreibung. Erzeugen mit:
#   brew install xcodegen
#   xcodegen generate
# Danach ReichiSync.xcodeproj in Xcode öffnen.
name: ReichiSync
options:
  bundleIdPrefix: de.reichi
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: de
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO

packages:
  ReichiSyncCore:
    path: .

targets:
  ReichiSync:
    type: application
    platform: macOS
    sources:
      - path: Sources/ReichiSyncApp
        excludes:
          - "Info.plist"
          - "ReichiSync.entitlements"
    dependencies:
      - package: ReichiSyncCore
        product: ReichiSyncCore
    info:
      path: Sources/ReichiSyncApp/Info.plist
    entitlements:
      path: Sources/ReichiSyncApp/ReichiSync.entitlements
    settings:
      base:
        PRODUCT_NAME: reichi Sync
        PRODUCT_BUNDLE_IDENTIFIER: de.reichi.sync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        # DEVELOPMENT_TEAM: XXXXXXXXXX   # eigenes Team eintragen oder in Xcode auswählen
    scheme:
      testTargets:
        - package: ReichiSyncCore/ReichiSyncCoreTests
      gatherCoverageData: true
