name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3
      - name: Build and test with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

  app-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test -Xswiftc -warnings-as-errors
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build Xcode target without signing
        run: >-
          xcodebuild
          -project ReichiSync.xcodeproj
          -scheme ReichiSync
          -configuration Debug
          -destination 'platform=macOS'
          ARCHS=x86_64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build and verify universal app bundle
        run: Scripts/build-app.sh release dist
      - name: Package downloadable app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/reichi Sync.app" \
            "dist/reichi-Sync-macOS-universal.zip"
          cd dist
          shasum -a 256 reichi-Sync-macOS-universal.zip \
            > reichi-Sync-macOS-universal.zip.sha256
      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: reichi-sync-macos-universal
          path: |
            dist/reichi-Sync-macOS-universal.zip
            dist/reichi-Sync-macOS-universal.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
