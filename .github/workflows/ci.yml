name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3
      - name: Build and test with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

  app-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test -Xswiftc -warnings-as-errors
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build Xcode target without signing
        run: >-
          xcodebuild
          -project ReichiSync.xcodeproj
          -scheme ReichiSync
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build and verify universal app bundle
        run: Scripts/build-app.sh debug dist
